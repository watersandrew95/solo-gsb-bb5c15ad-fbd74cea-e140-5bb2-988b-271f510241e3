<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>混响配方实验台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>🎛️ 混响配方实验台</h1>
    <p class="subtitle">Sabine 公式 RT60 = 0.161 · V / A，按 125 / 250 / 500 / 1000 / 2000 Hz 分频带计算</p>
  </header>

  <main>
    <!-- 左栏：房间配置 -->
    <section class="panel" id="config-panel">
      <h2>房间配置</h2>
      <div class="form-row">
        <label>实验名称
          <input type="text" id="exp-name" placeholder="例如：录音棚 A 方案" maxlength="80">
        </label>
        <label>房间体积 V (m³)
          <input type="number" id="volume" value="120" min="0.1" step="any">
        </label>
      </div>

      <h3>表面材料
        <span class="hint">总面积 <span id="total-area">0</span> m²</span>
      </h3>
      <table id="materials-table">
        <thead>
          <tr>
            <th>材料</th><th>面积 m²</th>
            <th>125</th><th>250</th><th>500</th><th>1000</th><th>2000</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="materials-body"></tbody>
      </table>
      <div class="btn-row">
        <button id="add-material" class="btn">＋ 添加材料</button>
        <select id="library-select"><option value="">从材料库添加…</option></select>
      </div>

      <h3>目标混响区间</h3>
      <div class="form-row">
        <label>下限 (s)
          <input type="number" id="target-min" value="0.4" min="0" step="0.05">
        </label>
        <label>上限 (s)
          <input type="number" id="target-max" value="0.8" min="0" step="0.05">
        </label>
      </div>

      <div class="btn-row">
        <button id="calc-btn" class="btn primary">计算 RT60</button>
        <button id="recommend-btn" class="btn accent">🔍 推荐材料替换</button>
        <button id="save-btn" class="btn">💾 保存实验</button>
      </div>
      <div id="message" class="message"></div>
    </section>

    <!-- 右栏：结果 -->
    <section class="panel" id="result-panel">
      <h2>计算结果</h2>
      <div id="result-summary" class="summary">尚未计算</div>
      <canvas id="rt-chart" width="640" height="360"></canvas>
      <table id="rt-table">
        <thead>
          <tr><th>频带</th><th>吸声量 A (m²)</th><th>RT60 (s)</th><th>判定</th></tr>
        </thead>
        <tbody id="rt-body"></tbody>
      </table>

      <div id="recommendation" class="recommendation hidden">
        <h3>🔍 推荐方案</h3>
        <div id="rec-content"></div>
        <div class="btn-row">
          <button id="apply-rec-btn" class="btn accent">应用此替换</button>
        </div>
        <div id="alternatives"></div>
      </div>
    </section>

    <!-- 底栏：已保存实验 -->
    <section class="panel wide" id="experiments-panel">
      <h2>已保存实验</h2>
      <table id="experiments-table">
        <thead><tr><th>ID</th><th>名称</th><th>保存时间</th><th>操作</th></tr></thead>
        <tbody id="experiments-body"></tbody>
      </table>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
